[package]
name = "sdk-mode-example"
version = "0.1.0"
edition = "2021"
rust-version = "1.82.0"
publish = false

# Deliberately NOT a workspace member. It depends on `invokr_sdk`, which is
# excluded from the workspace for its own MSRV and its AWS smithy runtime
# stack; pulling this in as a member would drag both back into the server
# build graph. Build it on its own:
#
#     just example-sdk-mode
[workspace]

[dependencies]
invokr_sdk = { path = "../../crates/client" }
aws-smithy-types = "1.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
anyhow = "1"
