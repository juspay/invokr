<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Invokr — live demo</title>
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%230f7b6c' stroke-width='3'/%3E%3Cpath d='M16 8v9l6 4' fill='none' stroke='%230f7b6c' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
</head>
<body>

<!-- One idea at a time. Each step owns the whole canvas and is drawn for that
     idea alone; the list on the left is a table of contents, not the
     explanation. Real data underneath — the frames are fed by a live run. -->

<header>
  <span class="brand">Invokr</span>
  <nav class="pages" id="pages"></nav>
  <span class="spacer"></span>

  <div class="lights">
    <span class="light" id="light-api"><i></i>api</span>
    <span class="light" id="light-worker"><i></i><span id="worker-count">0</span> workers</span>
    <span class="light" id="light-target"><i></i>aarokya</span>
  </div>

  <button class="toggle" id="replay-toggle" title="Play a recorded run instead of firing live jobs">
    <span class="track"></span><span>replay</span>
  </button>
  <span class="replay-flag">replaying</span>
</header>

<div class="takes" id="takes"></div>

<main>
  <!-- The question the room is already holding, and its one-line answer. -->
  <div class="pagehead">
    <h1 id="claim"></h1>
    <p id="subclaim"></p>
  </div>

  <div class="body">
    <ol class="steps" id="steps"></ol>

    <!-- One frame. It is replaced wholesale each step. -->
    <section class="frame" id="frame"></section>

    <!-- Evidence, on request: both sides of every call. -->
    <aside class="drawer" id="drawer">
      <div class="wire-half">
        <h4>on the wire <span class="meta" id="wire-meta"></span></h4>
        <div class="wire-body" id="wire-body"><span class="empty">nothing yet</span></div>
      </div>
      <div class="wire-half">
        <h4>aarokya's own log <span class="meta" id="log-meta"></span></h4>
        <div class="wire-body" id="target-log"><span class="empty">nothing yet</span></div>
      </div>
    </aside>
  </div>
</main>

<footer class="console">
  <div class="transport" id="transport">
    <button id="t-back" title="Back one step (←)">◀</button>
    <button id="t-next" title="Next step (→ or space)">▶</button>
    <button id="t-auto" class="wide" title="Walk the rest on its own">auto</button>
  </div>
  <span class="step-count" id="step-count"></span>
  <span class="spacer"></span>
  <div class="inputs" id="inputs"></div>
  <div class="extras" id="extras"></div>
  <button id="t-wire" title="Both sides of every call (W)">wire<span class="badge" id="wire-badge"></span></button>
  <button class="primary" id="go"></button>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
