name: Docker Build

# Validates the release image build (Dockerfile in .github/workflows/release.yml)
# without pushing anything, so a broken Dockerfile is caught on the PR rather
# than the next time someone runs the publish workflow.
on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/docker-build.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.binary }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mirrors the matrix in release.yml; the dashboard WASM stage only
          # runs for the API image.
          - binary: invokr-api
            features: ""
            include_dashboard: "true"
          - binary: invokr-worker
            features: ""
            include_dashboard: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: false
          build-args: |
            BINARY=${{ matrix.binary }}
            FEATURES=${{ matrix.features }}
            INCLUDE_DASHBOARD=${{ matrix.include_dashboard }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
