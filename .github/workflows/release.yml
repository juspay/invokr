name: Release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/invokr

permissions:
  contents: read

jobs:
  tag-release:
    name: Bump, changelog and tag
    runs-on: ubuntu-latest
    # The app's credentials live in the production environment, so only this
    # job on main can use them. Same setup as juspay/superposition and airborne.
    environment: production
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      # main's ruleset requires every change to go through a pull request, so
      # github-actions[bot] cannot push the version bump this job creates. This
      # app is on the ruleset's bypass list, so its token can.
      - name: Generate GitHub app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HYPER_SDK_APP_CLIENT_ID }}
          private-key: ${{ secrets.HYPER_SDK_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install cargo-edit
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cargo-edit
          version: "0.13.6"

      - name: Install cocogitto
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cocogitto
          version: "6.2.0"

      # Into RUNNER_TEMP, not GITHUB_WORKSPACE: the workspace IS the checkout, so
      # installing there leaves an untracked bin/ and `cog bump` refuses to run
      # against a dirty tree.
      - name: Install yq
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/yq" \
            https://github.com/mikefarah/yq/releases/download/v4.44.2/yq_linux_amd64
          chmod +x "$RUNNER_TEMP/bin/yq"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Bump version, write changelog, tag
        id: bump
        run: |
          set -euo pipefail
          git config user.email "invokr-bot@juspay.in"
          git config user.name "Invokr Bot"

          cog bump --auto --skip-ci-override "[skip ci]"

          tag=$(git describe --tags --abbrev=0)
          version="${tag#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Released $tag"

          # The chart version tracks the app version 1:1, so `helm install`
          # from a checkout and `helm pull` from the registry agree. Amend the
          # bump commit rather than adding a second one, then move the tag onto
          # it -- cog tagged the pre-amend commit, and the docker and
          # helm-chart jobs both check out by tag.
          yq eval ".version = \"${version}\"" -i helm/Chart.yaml
          yq eval ".appVersion = \"${version}\"" -i helm/Chart.yaml

          # helm-docs stamps the version into README badges. Rewriting them here
          # rather than running helm-docs keeps this job free of another tool;
          # the two patterns also cover the AppVersion badges, whose text ends
          # with the same substrings.
          sed -i -E \
            "s|Version: [0-9]+\.[0-9]+\.[0-9]+|Version: ${version}|g; \
             s|Version-[0-9]+\.[0-9]+\.[0-9]+-informational|Version-${version}-informational|g" \
            helm/README.md

          git add helm/Chart.yaml helm/README.md
          git commit --amend --no-edit
          git tag -f "$tag"

          # Built here rather than in github-release: cog and the full git
          # history (fetch-depth: 0) are only available in this job.
          cog changelog --at "$tag" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          retention-days: 1

      - name: Push
        run: |
          set -euo pipefail
          git push origin main
          git push origin "v${{ steps.bump.outputs.version }}"

  # Each architecture builds on a native runner and pushes an arch-suffixed tag;
  # create-manifest then joins them into one multi-arch tag. Deliberately not
  # `platforms: linux/amd64,linux/arm64` on a single runner -- that cross-builds
  # arm64 under QEMU, which for a Rust release build is punishingly slow.
  docker:
    name: ${{ matrix.image.image_name || matrix.image.binary }} (${{ matrix.arch }})
    needs: tag-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # Two real dimensions -- arch x image -- so this expands to the full 2x2
      # cross-product. `include` only attaches the runner for each arch.
      matrix:
        arch: [amd64, arm64]
        image:
          - binary: invokr-api
            features: ""
            include_dashboard: "true"
          - binary: invokr-worker
            features: ""
            include_dashboard: "false"
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: v${{ needs.tag-release.outputs.version }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only -- the per-arch tag is set explicitly below, because
      # metadata-action has no notion of the arch suffix.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.image_name || matrix.image.binary }}
          tags: type=raw,value=${{ needs.tag-release.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.image_name || matrix.image.binary }}:${{ needs.tag-release.outputs.version }}-linux-${{ matrix.arch }}
          build-args: |
            BINARY=${{ matrix.image.binary }}
            FEATURES=${{ matrix.image.features }}
            INCLUDE_DASHBOARD=${{ matrix.image.include_dashboard }}
          # Per-arch cache scope: one shared scope would have each architecture
          # evicting the other's layers on every release.
          cache-from: type=gha,scope=${{ matrix.image.image_name || matrix.image.binary }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.image_name || matrix.image.binary }}-${{ matrix.arch }}

  create-manifest:
    name: Multi-arch manifest for ${{ matrix.image_name || matrix.binary }}
    needs: [tag-release, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - binary: invokr-api
          - binary: invokr-worker
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the per-arch tags
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.image_name || matrix.binary }}
          VERSION: ${{ needs.tag-release.outputs.version }}
        run: |
          set -euo pipefail
          for tag in "$VERSION" latest; do
            docker buildx imagetools create --tag "$IMAGE:$tag" \
              "$IMAGE:$VERSION-linux-amd64" \
              "$IMAGE:$VERSION-linux-arm64"
          done
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  github-release:
    name: Publish GitHub release
    needs: [tag-release, create-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.tag-release.outputs.version }}
          name: v${{ needs.tag-release.outputs.version }}
          body_path: RELEASE_NOTES.md

  helm-chart:
    name: Package and publish the Helm chart
    # After create-manifest, not docker: `docker` only pushes the arch-suffixed
    # tags, and the version tag the chart actually references is created by the
    # manifest join. Depending on `docker` would publish a chart pointing at a
    # tag that does not exist yet.
    needs: [tag-release, create-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: v${{ needs.tag-release.outputs.version }}

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.1

      # Same registry as the images, so `helm pull` and `docker pull` need one
      # set of credentials. hyperswitch-helm consumes sibling charts this way.
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push
        run: |
          set -euo pipefail
          helm lint helm
          helm package helm
          helm push "invokr-${{ needs.tag-release.outputs.version }}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/helm-charts"
