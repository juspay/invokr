{{- if not .Values.existingSecret }}
{{/* Skipped when `existingSecret` is set -- point that at the Secret an
     ExternalSecret produces and leave `secrets` empty. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "invokr.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "invokr.labels" . | nindent 4 }}
type: Opaque
data:
  {{- include "invokr.secretsToData" .Values.secrets | nindent 2 }}
{{- end }}
