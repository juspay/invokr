{{- if .Values.api.ingress.enabled -}}
{{/* Leave disabled when routing through Istio. Note this Service also serves
     the dashboard, which renders the API key into its HTML. */}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "invokr.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "invokr.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
  {{- with .Values.api.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.api.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.api.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.api.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "invokr.fullname" $ }}-api
                port:
                  number: {{ $.Values.api.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
