{{/* Headless: exists so the ServiceMonitor has endpoints to discover. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "invokr.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "invokr.componentLabels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: ops
      port: {{ .Values.workerConfigs.metrics_port }}
      targetPort: ops
      protocol: TCP
  selector:
    {{- include "invokr.componentSelectorLabels" (dict "root" . "component" "worker") | nindent 4 }}
