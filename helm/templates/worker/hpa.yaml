{{- if .Values.worker.autoscaling.enabled }}
{{/* CPU is a poor proxy for queue depth. Cap maxReplicas against the
     database's max_connections -- each pod opens db_pool_size connections. */}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "invokr.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "invokr.componentLabels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "invokr.fullname" . }}-worker
  minReplicas: {{ .Values.worker.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.worker.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.worker.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.worker.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
{{- end }}
