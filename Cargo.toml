[workspace]
members = [
    "crates/common",
    "crates/api",
    "crates/worker",
    "crates/mock-server",
    "crates/dashboard",
    "examples/library-mode",
]
exclude = [
    # Generated client SDK — committed for downstream consumers (e.g. aarokya)
    # to depend on via `git`. Pins a different MSRV (1.82) and runtime stack
    # than the server workspace, so it stays out of the workspace build graph.
    "crates/client",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
actix-web = "4"
actix-rt = "2"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
log = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Kafka (feature-gated)
rdkafka = { version = "0.36", features = ["tokio"] }

# Redis (feature-gated)
redis = { version = "0.25", features = ["tokio-comp", "aio"] }

# Crypto
aes-gcm = "0.10"
rand = "0.8"

# JSON Schema validation
jsonschema = "0.18"

# Cron parsing
cron = "0.12"

# Time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Concurrent hashmap
dashmap = "5"

# Config
envy = "0.4"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Base64
base64 = "0.22"

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", features = ["http-listener"] }

# Authentication (OIDC / API tokens)
authn_kit = { git = "https://github.com/ayushjain17/authn_kit", rev = "671f4fca751e44cd0fdb9fdf5d4bcc53802c449b", default-features = false }

# AWS (KMS feature)
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-kms = "1"

# Leptos (dashboard SSR)
leptos = "0.7"
leptos_router = "0.7"
leptos_meta = "0.7"
leptos_actix = "0.7"

# Async utilities
tokio-util = { version = "0.7" }

# Async trait
async-trait = "0.1"

# Misc
dotenvy = "0.15"
