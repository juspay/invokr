# Prod-like Docker Compose: all services on a shared network with KMS.
# Use via: ./scripts/docker-prod.sh (handles migrations + KMS init)

services:
  postgres:
    build: docker/postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: invokr
      POSTGRES_PASSWORD: invokr
      POSTGRES_DB: invokr_db
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_cron"
      - "-c"
      - "cron.database_name=invokr_db"
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
    networks:
      - invokr-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invokr -d invokr_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: kms
      AWS_DEFAULT_REGION: us-east-1
    networks:
      - invokr-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  invokr-mock-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BINARY: invokr-mock-server
    ports:
      - "9999:9999"
    environment:
      MOCK_PORT: "9999"
    networks:
      - invokr-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9999/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  invokr-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BINARY: invokr-api
        FEATURES: kms
        INCLUDE_DASHBOARD: "true"
    ports:
      - "8080:8080"
    env_file:
      - path: .env.prod.kms
        required: false
    environment:
      INVOKR_LISTEN_ADDR: "0.0.0.0:8080"
      INVOKR_MODE: "both"
      INVOKR_PATH_PREFIX: "/invokr"
      INVOKR_DASHBOARD_PATH_PREFIX: "/dashboard"
      INVOKR_DASHBOARD_DIST_DIR: "/app/dashboard-dist"
    networks:
      - invokr-net
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/invokr/health"]
      interval: 5s
      timeout: 3s
      retries: 15

  invokr-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BINARY: invokr-worker
        FEATURES: kms
    ports:
      - "9090:9090"
    env_file:
      - path: .env.prod.kms
        required: false
    environment:
      INVOKR_METRICS_PORT: "9090"
    networks:
      - invokr-net
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      invokr-mock-server:
        condition: service_healthy
    healthcheck:
      # Liveness. The worker's ops routes are unprefixed — INVOKR_PATH_PREFIX
      # only moves the API's mount point, not the worker's ops port.
      test: ["CMD-SHELL", "curl -sf http://localhost:9090/health"]
      interval: 5s
      timeout: 3s
      retries: 15

networks:
  invokr-net:
    driver: bridge

volumes:
  postgres-prod-data:
